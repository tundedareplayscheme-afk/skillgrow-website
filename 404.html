<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — SkillGrow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Served by Vercel with a 404 status for any path that is not a real page.
   Standalone on purpose: it must not load the SPA, or the router would
   render the site over it. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
  background: #FAFAF7;
  color: #0F2D52;
  font-family: 'DM Sans', system-ui, sans-serif;
  text-align: center;
}
.logo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 500; color: #0F2D52; text-decoration: none; }
.eyebrow { display: block; margin: 48px 0 16px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #64748B; }
h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(40px, 7vw, 64px); font-weight: 500; line-height: 1.05; letter-spacing: -1.5px; }
h1 em { color: #F59E0B; font-weight: 400; }
p { margin: 18px auto 36px; max-width: 420px; font-size: 17px; line-height: 1.6; color: #64748B; }
.btn { display: inline-block; padding: 16px 30px; border-radius: 999px; background: #FCD34D; color: #020B18; font-weight: 700; text-decoration: none; transition: background .2s; }
.btn:hover { background: #F59E0B; }
</style>
</head>
<body>
<main>
  <a href="/" class="logo">SkillGrow</a>
  <span class="eyebrow">404</span>
  <h1>Page <em>not found.</em></h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="/" class="btn">Back to the homepage →</a>
</main>
</body>
</html>
